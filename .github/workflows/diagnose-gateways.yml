name: Diagnose free gateways

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/diagnose-gateways.mjs"
      - ".github/workflows/diagnose-gateways.yml"

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test live OpenCode synchronization and generated changes
        run: |
          node scripts/sync-opencode.mjs
          npm run check
          git diff --stat
      - name: Probe two no-key free models and classify errors
        run: node scripts/diagnose-gateways.mjs
