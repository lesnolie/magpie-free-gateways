name: Sync OpenCode upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opencode-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync catalog and upstream versions
        run: node scripts/sync-opencode.mjs
      - name: Run tests
        run: npm run check
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/opencode-upstream
          delete-branch: true
          add-paths: |
            src/zen-snapshot.json
            src/upstream-versions.json
            src/zen.mjs
          title: "chore: sync OpenCode upstream"
          commit-message: "chore: sync OpenCode upstream"
          body: |
            Automated upstream change review (every six hours):
            - OpenCode 1.x version marker
            - OpenCode 2.x release tracking (does not imply V2 compatibility)
            - Zen live zero-price model snapshot

            Unit tests passed before PR creation. Manual review required.
            This does not verify that third-party clients can use Zen's free tier.
